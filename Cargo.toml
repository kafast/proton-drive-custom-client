[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license-file = "LICENSE.md"
repository = "https://github.com/kafast/proton-drive-custom-client"
publish = false

# Shared versions of all dependencies. The individual crates only write
# `name.workspace = true`, so that every version lives in exactly one place.
[workspace.dependencies]
protonsync-domain = { path = "crates/domain" }
protonsync-api = { path = "crates/api" }
protonsync-application = { path = "crates/application" }
protonsync-testkit = { path = "crates/testkit" }
protonsync-adapter-state = { path = "crates/adapter-state" }
protonsync-adapter-fs = { path = "crates/adapter-fs" }
protonsync-adapter-proton = { path = "crates/adapter-proton" }
protonsync-adapter-sdk-helper = { path = "crates/adapter-sdk-helper" }
protonsync-daemon = { path = "crates/daemon", default-features = false }
protonsync-adapter-secrets = { path = "crates/adapter-secrets", default-features = false }
protonsync-web = { path = "crates/web" }
protonsync-fuse = { path = "crates/fuse" }
protonsync-client = { path = "crates/client" }
protonsync-tray-model = { path = "crates/tray-model" }
protonsync-adapter-notify = { path = "crates/adapter-notify" }
thiserror = "2"
async-lock = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "io-util", "time", "signal"] }
proptest = "1"
sha1 = "0.11"
tempfile = "3"
rusqlite = { version = "0.41", features = ["bundled"] }
# Proton connection: pinned exactly, use only in adapter-proton (ADR 0002).
proton-sdk = "=0.9.2"
proton-drive-rs = "=0.9.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Binary data (file contents) inside the JSON lines of the SDK helper protocol (ADR 0025).
base64 = "0.22"
# Secrets: Secret Service (pure Rust via zbus) or AES-256-GCM for the server file.
keyring = "4.2"
aes-gcm = "0.11"
zeroize = "1"
toml = "1.1"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6", features = ["derive"] }
rpassword = "7.5"
insta = "1.49"
# Local change detection (inotify on Linux).
notify = { version = "8.2", default-features = false }
# Time zones for the cron schedules of upload jobs (local time including daylight saving).
jiff = "0.2"
# Web interface: lean HTTP/1 without extras; TLS with the same crypto provider
# (aws-lc-rs) that reqwest already brings in.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "form", "query"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "logging", "tls12"] }
argon2 = "0.6"
# FUSE without libfuse (pure Rust, needs only `fusermount3` at runtime), see ADR 0010.
fuser = { version = "0.18", default-features = false }
# Only for constants such as `O_TRUNC` (no `unsafe`).
libc = "0.2"
# Safe wrapper for `statvfs` (free disk space), already in the tree via tempfile.
rustix = { version = "1", default-features = false, features = ["fs", "std"] }
getrandom = "0.4"
# Notifications (ADR 0017): HTTP for webhooks with the reqwest/rustls the Proton crates
# already bring in; SMTP via lettre on the same rustls.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "webpki-roots", "aws-lc-rs"] }
# Tray app: Qt 6/QML via cxx-qt (ADR 0011); Qt itself is linked dynamically from the system.
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }

# Lint rules for all crates (quality rules from CLAUDE.md, section 5).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# No unwrap()/expect() in production code; allowed in tests via clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "warn"
module_name_repetitions = "allow"
# Decision tables read better with one arm per case than merged.
match_same_arms = "allow"
