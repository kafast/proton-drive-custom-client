[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license-file = "LICENSE.md"
repository = "https://github.com/kafast/proton-drive-custom-client"
publish = false

# Gemeinsame Versionen aller Abhängigkeiten. Die einzelnen Crates schreiben nur
# `name.workspace = true`, damit jede Version genau an einer Stelle steht.
[workspace.dependencies]
protonsync-domain = { path = "crates/domain" }
protonsync-api = { path = "crates/api" }
protonsync-application = { path = "crates/application" }
protonsync-testkit = { path = "crates/testkit" }
protonsync-adapter-state = { path = "crates/adapter-state" }
protonsync-adapter-fs = { path = "crates/adapter-fs" }
protonsync-adapter-proton = { path = "crates/adapter-proton" }
protonsync-daemon = { path = "crates/daemon", default-features = false }
protonsync-adapter-secrets = { path = "crates/adapter-secrets", default-features = false }
protonsync-web = { path = "crates/web" }
protonsync-fuse = { path = "crates/fuse" }
protonsync-client = { path = "crates/client" }
protonsync-tray-model = { path = "crates/tray-model" }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "io-util", "time", "signal"] }
proptest = "1"
sha1 = "0.11"
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
# Proton-Anbindung: exakt gepinnt, nur in adapter-proton verwenden (ADR 0002).
proton-sdk = "=0.9.1"
proton-drive-rs = "=0.9.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Geheimnisse: Secret Service (rein in Rust über zbus) bzw. AES-256-GCM für die Server-Datei.
keyring = "4.2"
aes-gcm = "0.10"
zeroize = "1"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6", features = ["derive"] }
rpassword = "7.5"
insta = "1.49"
# Lokale Änderungserkennung (inotify unter Linux).
notify = { version = "8.2", default-features = false }
# Zeitzonen für Cron-Zeitpläne der Upload-Jobs (Ortszeit inkl. Sommerzeit).
jiff = "0.2"
# Web-Oberfläche: schlankes HTTP/1 ohne Zusatzfunktionen; TLS mit demselben
# Krypto-Anbieter (aws-lc-rs), den reqwest schon mitbringt.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "form", "query"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "logging", "tls12"] }
argon2 = "0.5"
# FUSE ohne libfuse (reines Rust, braucht zur Laufzeit nur `fusermount3`), siehe ADR 0010.
fuser = { version = "0.18", default-features = false }
# Nur für Konstanten wie `O_TRUNC` (ohne `unsafe`).
libc = "0.2"
getrandom = "0.2"
# Tray-App: Qt 6/QML über cxx-qt (ADR 0011); Qt selbst kommt dynamisch aus dem System.
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }

# Lint-Regeln für alle Crates (Qualitätsregeln aus CLAUDE.md, Abschnitt 5).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Kein unwrap()/expect() im Produktivcode; in Tests über clippy.toml erlaubt.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "warn"
module_name_repetitions = "allow"
# Entscheidungstabellen sind mit einem Arm pro Fall lesbarer als zusammengefasst.
match_same_arms = "allow"
