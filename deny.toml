# Dependency checks with `cargo deny check` (licenses, vulnerabilities, sources).

[graph]
all-features = true

[advisories]
# Security advisories from the RustSec database cause an error.
yanked = "deny"
ignore = [
    # `rsa` (via pgp in the Proton crates) is not constant-time. The attack needs a service
    # that decrypts for strangers over the network and responds measurably while doing so.
    # protonsync only decrypts its own data locally; there is no patch yet.
    # Check again on every update of the Proton crates.
    { id = "RUSTSEC-2023-0071", reason = "kein Netz-Orakel; kein Patch verfügbar" },
]

[licenses]
# Allowed licenses of dependencies. All are compatible with PolyForm Noncommercial.
# Qt (LGPL) is only linked dynamically and is not a Cargo crate.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # bzip2 (libbz2-rs-sys, via pgp): BSD-style license.
    "bzip2-1.0.6",
    # Mozilla root certificates (webpki-roots, via reqwest): permissive data license.
    "CDLA-Permissive-2.0",
    # notify (inotify binding): public domain.
    "CC0-1.0",
]
confidence-threshold = 0.9
# The list also covers future dependencies; unused entries are not an error.
unused-allowed-license = "allow"

[licenses.private]
# Our own crates are not published and carry the project license.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies without a version are allowed (the crates are not published).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
