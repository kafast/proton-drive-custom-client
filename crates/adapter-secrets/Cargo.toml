[package]
name = "protonsync-adapter-secrets"
description = "Secret store for protonsync: Secret Service (desktop) or encrypted file (server)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["keyring"]
# Secret Service (GNOME Keyring/KWallet). Can be turned off for the static server binary.
keyring = ["dep:keyring"]

[dependencies]
protonsync-application.workspace = true
aes-gcm.workspace = true
zeroize.workspace = true
thiserror.workspace = true
tempfile.workspace = true
keyring = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
