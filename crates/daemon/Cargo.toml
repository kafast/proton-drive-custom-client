[package]
name = "protonsync-daemon"
description = "Daemon von protonsync: Zusammenbau, Zeitplan, Ereignisse und API-Server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "protonsyncd"
path = "src/main.rs"

[features]
default = ["keyring", "fuse"]
# Secret Service für den Desktop; für das statische Server-Binary abschalten.
keyring = ["protonsync-adapter-secrets/keyring"]
# FUSE-Laufwerke (Platzhalter-Modus, nur Linux-Desktop); auf dem Server nicht nötig.
fuse = ["dep:protonsync-fuse"]

[dependencies]
protonsync-domain.workspace = true
protonsync-application.workspace = true
protonsync-api.workspace = true
protonsync-adapter-state.workspace = true
protonsync-adapter-fs.workspace = true
protonsync-adapter-proton.workspace = true
protonsync-adapter-secrets.workspace = true
protonsync-web.workspace = true
jiff.workspace = true
rpassword.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
protonsync-fuse = { workspace = true, optional = true }

[dev-dependencies]
protonsync-testkit.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
