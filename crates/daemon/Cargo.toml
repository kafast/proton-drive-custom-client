[package]
name = "protonsync-daemon"
description = "protonsync daemon: wiring, schedule, events and API server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "protonsyncd"
path = "src/main.rs"

[features]
default = ["keyring", "fuse"]
# Secret Service for the desktop; turn off for the static server binary.
keyring = ["protonsync-adapter-secrets/keyring"]
# FUSE drives (placeholder mode, Linux desktop only); not needed on the server.
fuse = ["dep:protonsync-fuse"]

[dependencies]
protonsync-domain.workspace = true
protonsync-application.workspace = true
protonsync-api.workspace = true
protonsync-adapter-state.workspace = true
protonsync-adapter-fs.workspace = true
protonsync-adapter-proton.workspace = true
protonsync-adapter-secrets.workspace = true
protonsync-web.workspace = true
jiff.workspace = true
rpassword.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
protonsync-fuse = { workspace = true, optional = true }

[dev-dependencies]
protonsync-testkit.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
