# Beispiel für docker compose / podman compose auf dem Server.
#   openssl rand -hex 32 > protonsync-key && chmod 0400 protonsync-key
#   sudo chown 65532 protonsync-key   # lesbar für den Benutzer „nonroot“ im Container
#   docker compose up -d
#   docker compose exec protonsync protonsync login
services:
  protonsync:
    image: protonsync:latest
    build:
      context: ../..
      dockerfile: packaging/container/Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./config.toml:/config/config.toml:ro
      - protonsync-data:/data
      # Sync-Ordner bzw. Quelle der Backups, z. B. Home-Assistant-Backups:
      - /srv/backup:/backup
    environment:
      # Ortszeit für die Zeitpläne der Upload-Jobs (sonst UTC).
      TZ: Europe/Berlin
    secrets:
      - protonsync-key
    # Web-Oberfläche (Abschnitt [web] in config.toml einschalten). Ohne IP vor
    # dem ersten Doppelpunkt wäre sie an allen Adressen des Hosts erreichbar.
    # ports:
    #   - "127.0.0.1:8470:8470"
    mem_limit: 256m

volumes:
  protonsync-data:

secrets:
  protonsync-key:
    file: ./protonsync-key
