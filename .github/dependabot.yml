# Weekly update proposals for Rust crates and GitHub Actions.
# Proton crates are pinned exactly (ADR 0002); Dependabot still reports new
# versions, but each one needs a manual review of the adapter.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: [proton-sdk, proton-drive-rs]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # The MSRV job pins the toolchain action to the Rust version (`@1.96`,
      # matches `rust-version`); Dependabot reads that as an action version and
      # proposes nonexistent Rust releases such as `@1.120`.
      - dependency-name: dtolnay/rust-toolchain
