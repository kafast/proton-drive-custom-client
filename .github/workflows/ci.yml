name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Format, Lint, Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Server-Build ohne Secret Service muss ebenso sauber sein.
      - run: cargo clippy -p protonsync-daemon --no-default-features --all-targets -- -D warnings
      - run: cargo test --workspace

  coverage:
    name: Testabdeckung (mind. 80 %)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info --fail-under-lines 80
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info

  server-image:
    name: Server-Image (musl, Container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/container/Dockerfile
          tags: protonsync:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Selbsttest und Größe
        run: |
          docker run --rm protonsync:ci --version
          docker run --rm --entrypoint /usr/local/bin/protonsync protonsync:ci --version
          docker image ls protonsync:ci --format 'Image-Größe: {{.Size}}'
      - name: Statische Binaries aus dem Image holen
        run: |
          id=$(docker create protonsync:ci)
          mkdir -p dist
          docker cp "$id:/usr/local/bin/protonsyncd" dist/
          docker cp "$id:/usr/local/bin/protonsync" dist/
          docker rm "$id"
          file dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: protonsync-x86_64-linux-musl
          path: dist/

  deny:
    name: Abhängigkeiten (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  secrets:
    name: Secret-Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
