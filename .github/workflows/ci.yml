name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Format, Lint, Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Qt 6 für die Tray-App (ADR 0011) und fuse3 für die echten Mount-Tests.
      - name: Systempakete
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fuse3 \
            qt6-base-dev qt6-declarative-dev libqt6svg6 \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-window qml6-module-qtquick-templates \
            qml6-module-qtqml-workerscript qml6-module-qt-labs-platform
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Server-Build ohne Secret Service muss ebenso sauber sein.
      - run: cargo clippy -p protonsync-daemon --no-default-features --all-targets -- -D warnings
      - run: cargo test --workspace
      # Dateimanager-Integration (ADR 0013): Nautilus-Erweiterung, Hilfsprogramm, Dolphin-Menü.
      - name: Dateimanager-Dateien prüfen
        run: |
          shellcheck packaging/filemanager/protonsync-filemanager
          python3 -m unittest discover -s packaging/filemanager/tests -v
      # Echter FUSE-Mount des virtuellen Laufwerks (über den Fakes, ohne Konto).
      - run: cargo test -p protonsync-fuse --test mount -- --ignored
      # Tray-App ohne Bildschirm: alle QML-Dateien laden; QML-Fehler lassen den Schritt scheitern.
      - name: Tray-App laden (--check)
        env:
          QT_QPA_PLATFORM: offscreen
          PROTONSYNC_SOCKET: /nonexistent/daemon.sock
        run: |
          # `cargo test` baut das Programm nicht mit, weil gui-qt keine Integrationstests hat.
          cargo build -p protonsync-gui-qt
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          status=0
          output="$(target/debug/protonsync-tray --check 2>&1)" || status=$?
          echo "$output"
          if echo "$output" | grep -E "qrc:/|TypeError|ReferenceError|is not defined|Cannot assign|Unable to assign"; then
            exit 1
          fi
          exit "$status"

  coverage:
    name: Testabdeckung (mind. 80 %)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Ohne die Qt-Brücke (gui-qt): Sie enthält keine Logik und wird oben gebaut und geladen.
      - run: cargo llvm-cov --workspace --exclude protonsync-gui-qt --lcov --output-path lcov.info --fail-under-lines 80
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info

  arch-package:
    name: Arch-Paket (makepkg)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Werkzeuge
        run: pacman -Syu --noconfirm --needed git cargo cmake python fuse3 qt6-base qt6-declarative qt6-svg namcap
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # makepkg läuft nicht als root; es baut genau diesen Commit aus der Arbeitskopie.
      - name: Paket bauen
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          commit="$(git -c safe.directory='*' rev-parse HEAD)"
          cd packaging/arch
          sudo -u builder env PROTONSYNC_GIT="file://$GITHUB_WORKSPACE#commit=$commit" makepkg --noconfirm
      - name: Paket prüfen und installieren
        run: |
          cd packaging/arch
          package="$(ls protonsync-git-*.pkg.tar.zst)"
          namcap "$package" || true
          pacman -Qlp "$package"
          pacman -U --noconfirm "$package"
          protonsync --version
          protonsyncd --version
          test -x /usr/bin/protonsync-filemanager
          grep -q '^ExecStart=/usr/bin/protonsyncd$' /usr/lib/systemd/user/protonsyncd.service
          grep -q '^ExecStart=/usr/bin/protonsyncd ' /usr/lib/systemd/system/protonsyncd.service
          grep -q '^serde ' /usr/share/licenses/protonsync-git/THIRD-PARTY-LICENSES.txt
          du -h "$package"

  server-image:
    name: Server-Image (musl, Container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/container/Dockerfile
          tags: protonsync:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Selbsttest und Größe
        run: |
          docker run --rm protonsync:ci --version
          docker run --rm --entrypoint /usr/local/bin/protonsync protonsync:ci --version
          docker image ls protonsync:ci --format 'Image-Größe: {{.Size}}'
      # Ressourcenverbrauch im Leerlauf (nicht angemeldet), für Handbuch 7.4.
      - name: Leerlauf-Speicher messen
        run: |
          work="$(mktemp -d)"
          mkdir "$work/backup"
          openssl rand -hex 32 > "$work/key"
          chmod 0600 "$work/key"
          sudo chown -R 65532:65532 "$work/key" "$work/backup"
          docker run -d --name idle --read-only --cap-drop ALL \
            -v "$PWD/packaging/container/config.toml:/config/config.toml:ro" \
            -v "$work/backup:/backup" -v "$work/key:/run/secrets/protonsync-key:ro" \
            --tmpfs /data:uid=65532,gid=65532,mode=0700 protonsync:ci
          sleep 20
          docker logs idle
          test "$(docker inspect -f '{{.State.Running}}' idle)" = true
          docker stats --no-stream --format 'Leerlauf / idle: RAM {{.MemUsage}}, CPU {{.CPUPerc}}' idle
          docker rm -f idle
      - name: Statische Binaries aus dem Image holen
        run: |
          id=$(docker create protonsync:ci)
          mkdir -p dist
          docker cp "$id:/usr/local/bin/protonsyncd" dist/
          docker cp "$id:/usr/local/bin/protonsync" dist/
          docker rm "$id"
          file dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: protonsync-x86_64-linux-musl
          path: dist/

  deny:
    name: Abhängigkeiten (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  secrets:
    name: Secret-Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
